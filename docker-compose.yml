services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mavie_hgest
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/mavie_hgest
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET no .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@maviehgest.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:3000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
